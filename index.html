<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapSnake IO - Complete Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #1a120b; font-family: Arial, sans-serif; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        
        .hud { position: absolute; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        #length-hud { top: 15px; left: 15px; border: 2px solid #00ff88; }
        #players-hud { top: 15px; left: 15px; margin-top: 45px; border: 2px solid #00ccff; }
        #powerups-hud { top: 15px; left: 15px; margin-top: 90px; border: 2px solid #bb66ff; }
        
        #leaderboard { position: absolute; top: 15px; right: 15px; margin-top: 70px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px; color: white; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; }
        #leaderboard h3 { color: #00ff88; margin-bottom: 10px; font-size: 14px; }
        #leaderboard ol { list-style: none; counter-reset: lb; max-height: 150px; overflow-y: auto; }
        #leaderboard li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); counter-increment: lb; font-size: 12px; }
        #leaderboard li.player { color: #00ff88; font-weight: bold; }
        
        #main-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(30,20,10,0.95)); padding: 50px 60px; border-radius: 25px; text-align: center; color: white; border: 3px solid #00ff88; z-index: 1000; pointer-events: auto; min-width: 350px; }
        #main-menu h1 { color: #00ff88; margin-bottom: 10px; font-size: 2.5em; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
        #main-menu .subtitle { color: #aaa; margin-bottom: 30px; }
        #main-menu input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #00ff88; background: rgba(255,255,255,0.1); color: white; font-size: 16px; margin-bottom: 15px; }
        #main-menu button { width: 100%; padding: 18px; border-radius: 12px; border: none; background: linear-gradient(135deg, #00ff88, #00ccff); color: #1a120b; font-size: 1.3em; font-weight: bold; cursor: pointer; }
        
        #death-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); padding: 40px 60px; border-radius: 25px; text-align: center; color: white; border: 3px solid #ff4444; z-index: 2000; pointer-events: auto; display: none; }
        #death-screen h2 { color: #ff4444; font-size: 2em; margin-bottom: 20px; }
        #final-score { font-size: 1.5em; color: #00ff88; margin-bottom: 20px; }
        .death-btn { padding: 15px 40px; border-radius: 10px; border: none; font-size: 1.1em; font-weight: bold; cursor: pointer; margin: 5px; }
        #respawn-btn { background: linear-gradient(135deg, #00ff88, #00ccff); color: #1a120b; }
        #menu-btn { background: #444; color: white; }
        
        #boost-bar { position: absolute; bottom: 20px; left: 20px; width: 200px; height: 25px; background: rgba(0,0,0,0.6); border-radius: 12px; overflow: hidden; border: 2px solid #ff6600; }
        #boost-fill { height: 100%; background: linear-gradient(90deg, #ff6600, #ffaa00); width: 0%; }
        #boost-text { position: absolute; width: 100%; text-align: center; line-height: 21px; font-size: 12px; color: white; font-weight: bold; }
        
        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0,0,0,0.8); border: 2px solid #00ff88; border-radius: 50%; overflow: hidden; }
        #minimap { width: 100%; height: 100%; }
        
        #powerup-display { position: absolute; top: 135px; left: 15px; z-index: 100; }
        .buff { background: rgba(0,255,136,0.2); border: 2px solid #00ff88; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; color: #00ff88; font-size: 13px; font-weight: bold; animation: pulse 1s infinite; display: flex; align-items: center; gap: 8px; }
        .buff-icon { font-size: 26px; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        
        #crosshair { position: absolute; width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; display: none; }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="length-hud" class="hud">Length: <span id="score">10</span></div>
        <div id="players-hud" class="hud">Players: <span id="players">0</span></div>
        <div id="powerups-hud" class="hud">⚡ Power-Ups: <span id="powerup-count">0</span></div>
        
        <div id="leaderboard">
            <h3>🏆 TOP PLAYERS</h3>
            <ol id="lb-list"></ol>
        </div>
        
        <div id="powerup-display"></div>
        
        <div id="boost-bar">
            <div id="boost-fill"></div>
            <span id="boost-text">BOOST</span>
        </div>
        
        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="main-menu">
        <h1>🐍 SNAP SNAKE</h1>
        <p class="subtitle">Full Graphics + Working Turns + 10 Power-Ups Always!</p>
        <input type="text" id="nickname" placeholder="Nickname" maxlength="12">
        <button onclick="startGame()">▶️ PLAY NOW</button>
        <p style="margin-top:15px;font-size:11px;color:#888;">🖱️ Mouse to turn • Hold click to boost</p>
    </div>
    
    <div id="death-screen">
        <h2>💀 YOU DIED!</h2>
        <div id="final-score">Final Length: 10</div>
        <button id="respawn-btn" class="death-btn" onclick="respawn()">🔄 AGAIN</button>
        <button id="menu-btn" class="death-btn" onclick="showMenu()">🏠 MENU</button>
    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        minimapCanvas.width = 150;
        minimapCanvas.height = 150;
        
        let running = false;
        let player = null;
        let snakes = [];
        let foods = [];
        let powerups = [];
        let particles = [];
        let camera = { x: 0, y: 0, zoom: 1 };
        let mouse = { x: canvas.width/2, y: canvas.height/2 };
        let targetAngle = 0;
        
        const CONFIG = {
            worldSize: 6000,
            speed: 200,
            boostSpeed: 400,
            turnSpeed: 14,
            radius: 14,
            segmentSpacing: 5,
            foodCount: 800,
            powerupMin: 10,      // ← AT LEAST 10 POWER-UPS ALWAYS ALIVE
            powerupMax: 15
        };

        // FRUITS & VEGGIES
        const FRUITS = [
            {e:'🍒',c:'#ff0044',v:1,r:6},{e:'🍎',c:'#ff3333',v:2,r:8},{e:'🍊',c:'#ff8800',v:2,r:8},
            {e:'🍉',c:'#ff3366',v:3,r:10},{e:'🍇',c:'#8800cc',v:2,r:8},{e:'🍍',c:'#ffcc00',v:3,r:10},
            {e:'🥝',c:'#88aa00',v:2,r:8},{e:'🍑',c:'#ffaa66',v:2,r:8},{e:'🍌',c:'#ffff44',v:4,r:11},
            {e:'🥕',c:'#ff6600',v:2,r:8},{e:'🥦',c:'#22aa22',v:3,r:9},{e:'🌽',c:'#ffdd44',v:3,r:9},
            {e:'🍆',c:'#6600cc',v:3,r:9},{e:'🥑',c:'#44aa44',v:4,r:10},{e:'🍋',c:'#ffff00',v:4,r:10}
        ];

        // POWERUPS with rarity weights + tuned durations
        const POWERUPS = [
            {t:'sprint',    i:'⚡', c:'#ff6600', dur:20000, weight:40},  // Common - 20s
            {t:'telescope', i:'🔭', c:'#9933ff', dur:20000, weight:35},  // Common - 20s
            {t:'feast',     i:'🍽️', c:'#00ffcc', dur:15000, weight:15},  // Rare   - 15s (2x is strong)
            {t:'magnet',    i:'🧲', c:'#ff3399', dur:20000, weight:10}   // Rare   - pulls food to you
        ];
        const TOTAL_WEIGHT = POWERUPS.reduce((sum,p) => sum+p.weight, 0);

        let activeBuffs = {};

        // ============================================
        // INPUT - GUARANTEED TO WORK
        // ============================================
        canvas.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('crosshair').style.left = e.clientX + 'px';
            document.getElementById('crosshair').style.top = e.clientY + 'px';
        });
        
        canvas.addEventListener('mousedown', () => { if(player) player.boosting = true; });
        canvas.addEventListener('mouseup', () => { if(player) player.boosting = false; });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            if(player) player.boosting = true;
        }, {passive:false});
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, {passive:false});
        
        canvas.addEventListener('touchend', () => { if(player) player.boosting = false; });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ============================================
        // SNAKE CLASS
        // ============================================
        class Snake {
            constructor(x, y, name, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.angle = 0;
                this.radius = CONFIG.radius;
                this.name = name;
                this.isPlayer = isPlayer;
                this.color = isPlayer ? '#00ff88' : '#' + Math.floor(Math.random()*16777215).toString(16);
                this.score = 12;
                this.boosting = false;
                this.alive = true;
                this.segments = [];
                
                for(let i=0; i<12; i++) {
                    this.segments.push({x: x - i*CONFIG.segmentSpacing, y: y});
                }
            }
            
            update(dt) {
                if(!this.alive) return;
                
                // ========== TURN LOGIC ==========
                if(this.isPlayer && running) {
                    const screenX = this.x - camera.x;
                    const screenY = this.y - camera.y;
                    targetAngle = Math.atan2(mouse.y - screenY, mouse.x - screenX);
                }
                
                let diff = targetAngle - this.angle;
                while(diff > Math.PI) diff -= Math.PI*2;
                while(diff < -Math.PI) diff += Math.PI*2;
                
                const maxTurn = CONFIG.turnSpeed * dt;
                if(Math.abs(diff) < maxTurn) {
                    this.angle = targetAngle;
                } else {
                    this.angle += Math.sign(diff) * maxTurn;
                }
                
                // Speed
                let speed = CONFIG.speed;
                if(activeBuffs.sprint) speed *= 1.5;
                if(this.boosting && this.score > 15) {
                    speed = CONFIG.boostSpeed;
                    this.score -= 4*dt;
                }
                
                this.x += Math.cos(this.angle) * speed * dt;
                this.y += Math.sin(this.angle) * speed * dt;
                
                this.x = Math.max(this.radius, Math.min(CONFIG.worldSize-this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(CONFIG.worldSize-this.radius, this.y));
                
                this.segments.unshift({x:this.x, y:this.y});
                while(this.segments.length > Math.floor(this.score)) {
                    this.segments.pop();
                }
            }
            
            draw() {
                if(!this.alive) return;
                
                const cx = camera.x, cy = camera.y;
                
                for(let i=this.segments.length-1; i>=0; i--) {
                    const seg = this.segments[i];
                    const r = this.radius * (1 - i/this.segments.length*0.4);
                    const alpha = 0.9 - i/this.segments.length*0.5;
                    
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = this.isPlayer ? 15 : 8;
                    ctx.beginPath();
                    ctx.arc(seg.x-cx, seg.y-cy, r, 0, Math.PI*2);
                    
                    const rgb = hexToRgb(this.color);
                    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                
                ctx.beginPath();
                ctx.arc(this.x-cx, this.y-cy, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                const eyeOff = this.radius*0.5;
                ctx.beginPath();
                ctx.arc(this.x-cx+Math.cos(this.angle-0.5)*eyeOff, this.y-cy+Math.sin(this.angle-0.5)*eyeOff, 3, 0, Math.PI*2);
                ctx.arc(this.x-cx+Math.cos(this.angle+0.5)*eyeOff, this.y-cy+Math.sin(this.angle+0.5)*eyeOff, 3, 0, Math.PI*2);
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 5;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.beginPath();
                ctx.arc(this.x-cx+Math.cos(this.angle-0.5)*eyeOff, this.y-cy+Math.sin(this.angle-0.5)*eyeOff, 1.5, 0, Math.PI*2);
                ctx.arc(this.x-cx+Math.cos(this.angle+0.5)*eyeOff, this.y-cy+Math.sin(this.angle+0.5)*eyeOff, 1.5, 0, Math.PI*2);
                ctx.fillStyle = 'black';
                ctx.fill();
                
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.strokeText(this.name, this.x-cx, this.y-cy-this.radius-10);
                ctx.fillText(this.name, this.x-cx, this.y-cy-this.radius-10);
                ctx.shadowBlur = 0;
            }
            
            die() {
                this.alive = false;
                for(let i=0; i<this.segments.length; i+=2) {
                    const s = this.segments[i];
                    foods.push({
                        x:s.x+(Math.random()-0.5)*20,
                        y:s.y+(Math.random()-0.5)*20,
                        ...FRUITS[Math.floor(Math.random()*FRUITS.length)]
                    });
                }
                for(let i=0; i<25; i++) {
                    particles.push({
                        x:this.x, y:this.y,
                        vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15,
                        life:1, color:this.color, size:Math.random()*6+3
                    });
                }
            }
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return {r,g,b};
        }

        // ============================================
        // SPAWNING
        // ============================================
        function spawnFood() {
            const f = {...FRUITS[Math.floor(Math.random()*FRUITS.length)]};
            foods.push({
                x:Math.random()*CONFIG.worldSize,
                y:Math.random()*CONFIG.worldSize,
                ...f
            });
        }
        
        function pickWeightedPowerup() {
            let roll = Math.random() * TOTAL_WEIGHT;
            for(const p of POWERUPS) {
                roll -= p.weight;
                if(roll <= 0) return p;
            }
            return POWERUPS[0];
        }
        
        function spawnPowerup(nearX, nearY) {
            const p = pickWeightedPowerup();
            let x, y;
            if(nearX !== undefined && Math.random() < 0.5) {
                // Spawn somewhere near a given point (for respawns close to action)
                x = nearX + (Math.random()-0.5) * 1500;
                y = nearY + (Math.random()-0.5) * 1500;
            } else {
                x = Math.random()*CONFIG.worldSize;
                y = Math.random()*CONFIG.worldSize;
            }
            powerups.push({
                x: Math.max(100, Math.min(CONFIG.worldSize-100, x)),
                y: Math.max(100, Math.min(CONFIG.worldSize-100, y)),
                r: 16,
                ...JSON.parse(JSON.stringify(p))
            });
        }
        
        // GUARANTEE: keep at least powerupMin power-ups alive at all times
        function maintainPowerups(eatenAtX, eatenAtY) {
            while(powerups.length < CONFIG.powerupMin) {
                spawnPowerup(eatenAtX, eatenAtY);
            }
            if(powerups.length > CONFIG.powerupMax) {
                powerups.splice(CONFIG.powerupMax);
            }
        }

        // ============================================
        // POWERUP LOGIC
        // ============================================
        function activateBuff(type, duration) {
            activeBuffs[type] = {endTime: performance.now()+duration};
            updateBuffDisplay();
        }
        
        function checkBuffs() {
            const now = performance.now();
            let changed = false;
            for(const t in activeBuffs) {
                if(now >= activeBuffs[t].endTime) { delete activeBuffs[t]; changed = true; }
            }
            if(changed) updateBuffDisplay();
        }
        
        function updateBuffDisplay() {
            const cont = document.getElementById('powerup-display');
            cont.innerHTML = '';
            for(const t in activeBuffs) {
                const p = POWERUPS.find(x=>x.t===t);
                const rem = Math.ceil((activeBuffs[t].endTime - performance.now())/1000);
                const div = document.createElement('div');
                div.className = 'buff';
                div.style.borderColor = p.c;
                div.style.color = p.c;
                div.innerHTML = `<span class="buff-icon">${p.i}</span> ${t.toUpperCase()} — ${rem}s`;
                cont.appendChild(div);
            }
        }

        // ============================================
        // COLLISIONS
        // ============================================
        function checkCollisions() {
            if(!player || !player.alive) return;
            
            // Food
            for(let i=foods.length-1; i>=0; i--) {
                const f = foods[i];
                let d = Math.hypot(player.x-f.x, player.y-f.y);
                
                // Magnet powerup pulls food toward you
                if(activeBuffs.magnet && d < 250) {
                    const pull = 6;
                    f.x += (player.x-f.x)/d*pull;
                    f.y += (player.y-f.y)/d*pull;
                }
                
                if(d < player.radius+f.r+5) {
                    let val = f.v;
                    if(activeBuffs.feast) val *= 2;
                    player.score += val;
                    foods.splice(i,1);
                }
            }
            while(foods.length < CONFIG.foodCount) spawnFood();
            
            // Powerups - eating one immediately respawns another to keep 10+ alive
            for(let i=powerups.length-1; i>=0; i--) {
                const p = powerups[i];
                const d = Math.hypot(player.x-p.x, player.y-p.y);
                if(d < player.radius+p.r+8) {
                    activateBuff(p.t, p.dur);
                    // Small burst particles
                    for(let k=0; k<12; k++) {
                        particles.push({
                            x:p.x, y:p.y,
                            vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10,
                            life:1, color:p.c, size:Math.random()*5+2
                        });
                    }
                    powerups.splice(i,1);
                    maintainPowerups(player.x, player.y);  // INSTANT respawn of another one
                }
            }
            
            // Other snakes
            for(const s of snakes) {
                if(s===player || !s.alive) continue;
                for(let i=2; i<s.segments.length; i++) {
                    const seg = s.segments[i];
                    const d = Math.hypot(player.x-seg.x, player.y-seg.y);
                    if(d < player.radius+s.radius-2) {
                        player.die();
                        showDeath();
                        return;
                    }
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            const grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
            grad.addColorStop(0,'#1a120b');
            grad.addColorStop(0.5,'#2d1f14');
            grad.addColorStop(1,'#1a120b');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width+100; x+=50) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
            }
            for(let y=0; y<canvas.height+100; y+=50) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
            }
            
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 4;
            ctx.setLineDash([15,10]);
            ctx.strokeRect(-camera.x, -camera.y, CONFIG.worldSize, CONFIG.worldSize);
            ctx.setLineDash([]);
            
            // Food with glow
            for(const f of foods) {
                const sx = f.x-camera.x, sy = f.y-camera.y;
                if(sx<-30||sx>canvas.width+30||sy<-30||sy>canvas.height+30) continue;
                
                ctx.shadowColor = f.c;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(sx, sy, f.r+2, 0, Math.PI*2);
                ctx.fillStyle = f.c+'40';
                ctx.fill();
                
                ctx.font = `${f.r*2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.shadowBlur = 0;
                ctx.fillText(f.e, sx, sy+2);
            }
            
            // Powerups - big glowing orbs with pulsing rings
            const pulse = 1 + Math.sin(performance.now()/200)*0.15;
            for(const p of powerups) {
                const sx = p.x-camera.x, sy = p.y-camera.y;
                if(sx<-60||sx>canvas.width+60||sy<-60||sy>canvas.height+60) continue;
                
                // Outer pulsing ring
                ctx.beginPath();
                ctx.arc(sx, sy, (p.r+10)*pulse, 0, Math.PI*2);
                ctx.strokeStyle = p.c+'80';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Glow orb
                ctx.shadowColor = p.c;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(sx, sy, p.r+5, 0, Math.PI*2);
                ctx.fillStyle = p.c;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Big icon
                ctx.font = '32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'white';
                ctx.fillText(p.i, sx, sy);
            }
            
            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life<=0) { particles.splice(i,1); continue; }
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x-camera.x, p.y-camera.y, p.size*p.life, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
            
            // Snakes
            for(const s of snakes) {
                if(s.alive) s.draw();
            }
        }
        
        function drawMinimap() {
            minimapCtx.clearRect(0,0,minimapCanvas.width,minimapCanvas.height);
            
            const sx = minimapCanvas.width/CONFIG.worldSize;
            const sy = minimapCanvas.height/CONFIG.worldSize;
            
            minimapCtx.fillStyle = 'rgba(0,0,0,0.5)';
            minimapCtx.fillRect(0,0,minimapCanvas.width,minimapCanvas.height);
            
            // Powerup dots on minimap (so you can hunt them!)
            for(const p of powerups) {
                minimapCtx.beginPath();
                minimapCtx.arc(p.x*sx, p.y*sy, 2.5, 0, Math.PI*2);
                minimapCtx.fillStyle = p.c;
                minimapCtx.fill();
            }
            
            for(const s of snakes) {
                if(!s.alive) continue;
                minimapCtx.beginPath();
                minimapCtx.arc(s.x*sx, s.y*sy, s.isPlayer?4:2, 0, Math.PI*2);
                minimapCtx.fillStyle = s.isPlayer ? '#00ff88' : s.color;
                minimapCtx.fill();
            }
            
            minimapCtx.strokeStyle = '#fff';
            minimapCtx.lineWidth = 1;
            minimapCtx.strokeRect(camera.x*sx, camera.y*sy, canvas.width*sx, canvas.height*sy);
        }

        // ============================================
        // UI & LOOP
        // ============================================
        function updateUI() {
            if(player) {
                document.getElementById('score').textContent = Math.floor(player.score);
                const pct = Math.min(100, Math.max(0, (player.score-15)/50*100));
                document.getElementById('boost-fill').style.width = pct+'%';
            }
            document.getElementById('powerup-count').textContent = powerups.length;
            
            const sorted = snakes.filter(s=>s.alive).sort((a,b)=>b.score-a.score).slice(0,10);
            document.getElementById('lb-list').innerHTML = sorted.map(s => 
                `<li class="${s.isPlayer?'player':''}">${s.name}: ${Math.floor(s.score)}</li>`
            ).join('');
            document.getElementById('players').textContent = snakes.filter(s=>s.alive).length;
        }

        let lastTime = 0;
        function loop(now) {
            const dt = Math.min((now-lastTime)/1000, 0.1);
            lastTime = now;
            
            checkBuffs();
            
            if(running && player && player.alive) {
                player.update(dt);
                checkCollisions();
            }
            
            // Keep powerup count guaranteed even without eating (safety net)
            maintainPowerups();
            
            // Camera
            if(player && player.alive) {
                const zoom = activeBuffs.telescope ? 0.65 : 1;
                camera.zoom += (zoom-camera.zoom)*0.15;
                camera.x = player.x*(1/camera.zoom) - canvas.width/2;
                camera.y = player.y*(1/camera.zoom) - canvas.height/2;
                camera.x = Math.max(0, Math.min(CONFIG.worldSize-canvas.width, camera.x));
                camera.y = Math.max(0, Math.min(CONFIG.worldSize-canvas.height, camera.y));
            }
            
            // Bots
            if(!player) {
                snakes = snakes.filter(s=>s.alive);
                while(snakes.length < 60) {
                    const bot = new Snake(
                        Math.random()*CONFIG.worldSize,
                        Math.random()*CONFIG.worldSize,
                        'Bot'+snakes.length
                    );
                    snakes.push(bot);
                }
            }
            snakes.forEach(s => { if(!s.isPlayer && s.alive && running) s.update(dt); });
            
            draw();
            drawMinimap();
            updateUI();
            
            requestAnimationFrame(loop);
        }

        // ============================================
        // MENU FUNCTIONS
        // ============================================
        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('death-screen').style.display = 'none';
            
            running = true;
            player = new Snake(
                CONFIG.worldSize/2, CONFIG.worldSize/2,
                document.getElementById('nickname').value || 'Player', true
            );
            snakes = [player];
            foods = [];
            particles = [];
            activeBuffs = {};
            
            for(let i=0; i<CONFIG.foodCount; i++) spawnFood();
            
            // Spawn the guaranteed powerups immediately
            powerups = [];
            maintainPowerups();
            
            lastTime = performance.now();
        }
        
        function showDeath() {
            document.getElementById('death-screen').style.display = 'block';
            document.getElementById('final-score').textContent = 'Final: ' + Math.floor(player?.score||0);
            running = false;
        }
        
        function respawn() {
            document.getElementById('death-screen').style.display = 'none';
            snakes = [];
            foods = [];
            particles = [];
            activeBuffs = {};
            player = new Snake(
                CONFIG.worldSize/2, CONFIG.worldSize/2,
                document.getElementById('nickname').value || 'Player', true
            );
            snakes = [player];
            for(let i=0; i<CONFIG.foodCount; i++) spawnFood();
            powerups = [];
            maintainPowerups();
            running = true;
        }
        
        function showMenu() {
            document.getElementById('death-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
            running = false;
        }

        // Start loop
        requestAnimationFrame(loop);
    </script>
</body>
</html>
